const picker=document.querySelector('select'), pages=[...document.querySelectorAll('figure')];
const previous=document.getElementById('previous'), next=document.getElementById('next');
function sync(){
  const edge=document.querySelector('nav').getBoundingClientRect().bottom+16;
  let n=1;
  for(const [i,page] of pages.entries()) if(page.getBoundingClientRect().top<=edge) n=i+1;
  if(Math.ceil(scrollY+innerHeight)>=document.documentElement.scrollHeight) n=pages.length;
  picker.value=String(n);previous.disabled=n===1;next.disabled=n===pages.length;
}
function showPage(n){const page=pages[n-1];if(page){page.scrollIntoView();sync()}}
picker.onchange=()=>showPage(Number(picker.value));
previous.onclick=()=>showPage(Number(picker.value)-1);
next.onclick=()=>showPage(Number(picker.value)+1);
addEventListener('scroll',sync,{passive:true});
addEventListener('load',()=>{showPage(Number(location.hash.split('=')[1])||1)});
</script></html>
