   if(v.slots[i]!=='—')add(cell,'p','지정 병사 '+v.slots[i]+' 1기 (아래 합계에 포함)').className='focus';
   add(cell,'p',Object.entries(g).map(([k,c])=>k+' '+c+'기').join(' · ')||'빈 구역');
 }
}
function setRound(){wave.replaceChildren();for(const v of stages[round.selectedIndex].variants)wave.add(new Option(v.wave+' '+v.label));show()}
for(const s of stages)round.add(new Option(s.round+'라운드 · '+s.title));round.onchange=setRound;wave.onchange=show;setRound();
</script><script src="../_shared/report.js"></script></body></html>
